apply plugin: 'java-base'

subprojects {
  configurations {
    javadocClasspathElements {
      canBeConsumed = true
      canBeResolved = false
      extendsFrom(configurations.compileClasspath)
    }
  }
}

repositories {
  mavenCentral()
  maven {
    name = 'Central Portal Snapshots'
    url = 'https://central.sonatype.com/repository/maven-snapshots/'
    mavenContent {
      snapshotsOnly()
    }
    content {
      includeGroup("org.seleniumhq.selenium")
    }
  }
}

configurations {
  javadocForSiteClasspath
}

dependencies {
  subprojects.each { subproject ->
    javadocForSiteClasspath project(path: subproject.path, configuration: 'javadocClasspathElements')
  }
}

tasks.register('javadocForSite', Javadoc) {
  source = subprojects.sourceSets.main.allJava
  destinationDir = file(project.layout.buildDirectory.dir("javadoc-for-site"))
  classpath = configurations.javadocForSiteClasspath

  def javadocStylesheet = file('gradle/javadoc-style.css')
  inputs.file(javadocStylesheet).withPropertyName('javadocStylesheet')
  options.addStringOption('-add-stylesheet', javadocStylesheet.absolutePath)

  // modules/cli and modules/mcp use the shadow plugin with an empty archiveClassifier, so their
  // shadowJar output overwrites the same file as their jar output. Since jar and shadowJar aren't
  // ordered relative to each other, order javadocForSite after both so it never races the
  // overwrite (same race fixed for `:modules:mcp:test` in modules/mcp/build.gradle).
  mustRunAfter ':modules:cli:jar', ':modules:cli:shadowJar'
  mustRunAfter ':modules:mcp:jar', ':modules:mcp:shadowJar'
}
